[project]
name = "biva-auto-qa"
version = "0.1.0"
description = "Bot QA cho callbot BIVA: chạy kịch bản YAML qua SSE chat, chấm lớp protocol, xuất JSONL + báo cáo"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[project.scripts]
autoqa = "autoqa.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
ui = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoqa"]
