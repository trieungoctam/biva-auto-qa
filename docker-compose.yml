# auto-qa web UI — deploy VPS (docs/RUNBOOK.md, docs/TECH-DESIGN.md)
# Chuẩn bị: .env chứa GEMINI_API_KEY, AUTOQA_LIVE_DEMO_TOKEN, AUTOQA_ADMIN_KEY
# (dùng 1 lần tạo admin đầu, rồi gỡ được).
# Chạy:     docker compose up -d --build   →  http://<vps>:8788
# Người dùng: admin thêm qua tab Admin (users.yaml chỉ lưu key đã băm).
# Lịch chạy tự động: khai báo schedules.yaml (mẫu cuối file này).
services:
  autoqa:
    build: .
    restart: unless-stopped
    ports:
      - "8788:8788"
    env_file: .env            # GEMINI_API_KEY, AUTOQA_LIVE_DEMO_TOKEN, AUTOQA_ADMIN_KEY…
    volumes:
      - ./runs:/app/runs      # lịch sử + INDEX.md + review (rw — sống sót qua rebuild)
      - ./bots:/app/bots      # rw: admin sửa nghiệp vụ/kịch bản từ UI (raw/ vẫn bị chặn app layer)
      - ./.git:/app/.git      # git audit: mỗi lần sửa từ UI = 1 commit (history + backup)
      - ./config.yaml:/app/config.yaml:ro
      - ./users.yaml:/app/users.yaml         # người dùng (key đã băm) — tạo rỗng nếu chưa có
      - ./schedules.yaml:/app/schedules.yaml # lịch chạy tự động — tạo rỗng nếu chưa có
